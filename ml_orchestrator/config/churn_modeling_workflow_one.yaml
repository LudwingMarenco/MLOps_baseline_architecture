data:
  train_query: "churn_modeling_workflow_one_train.sql"
  serving_query: "churn_modeling_workflow_one_serving.sql"
  chunk_size: 10000
  levels:
    0923_1737:
      context:
        tables:
          name: 0923_1737
    1023_2038:
      context:
        tables:
          name: 1023_2038
    1127_1528:
      context:
        tables:
          name: 1127_1528
training:
  test_size: 0.3
  sample_weights: True
  model_1:
    target_accuracy: 0.8098
    scaler: "passthrough"
    model_name: "histgradientboosting"
    params:
      loss: "log_loss"
      learning_rate: 0.0090
      max_iter: 323
      max_leaf_nodes: 49
      max_depth: 3
      min_samples_leaf: 37
      l2_regularization: 0.0047
  model_2:
    target_accuracy: 0.8276
    scaler: "robustscaler"
    model_name: "kneighbors"
    params:
      n_neighbors: 3
      weights: "distance"
      leaf_size: 26
      p: 2
  model_3:
    target_accuracy: 0.8238
    scaler: "passthrough"
    model_name: "extratrees"
    params:
      n_estimators: 376
      max_depth: 25
      min_samples_split: 6
      min_samples_leaf: 2
      max_features: "sqrt"
serving:
  join_column:
    name: "MERCHANT_ID"
    type: "VARCHAR(16777216)"
  prediction_column:
    name: "PREDICTION"
    type: "INT"
  table_name: "ML_PREDICTION"
  output_path: "data/predictions"