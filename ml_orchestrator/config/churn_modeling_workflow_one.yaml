data:
  train_query: "churn_modeling_workflow_one.sql"
training:
  test_size: 0.3
  sample_weights: True
  model_1:
    target_accuracy: 0.8098
    scaler: "passthrough"
    model_name: "histgradientboosting"
    params:
      loss: "log_loss"
      learning_rate: 0.0090
      max_iter: 323
      max_leaf_nodes: 49
      max_depth: 3
      min_samples_leaf: 37
      l2_regularization: 0.0047
  model_2:
    target_accuracy: 0.8276
    scaler: "robustscaler"
    model_name: "kneighbors"
    params:
      n_neighbors: 3
      weights: "distance"
      leaf_size: 26
      p: 2
  model_3:
    target_accuracy: 0.8238
    scaler: "passthrough"
    model_name: "extratrees"
    params:
      n_estimators: 376
      max_depth: 25
      min_samples_split: 6
      min_samples_leaf: 2
      max_features: "sqrt"
serving:
  pass: true